[mafft_default]
_desc = 'Mafft with default parameters'
_app = mafft
mode = auto
op = 1.53  # Gap opening penalty at group-to-group alignment. Default: 1.53
ep = 0.123 # Offset value, which works like gap extension penalty, for group-to-group alignment. Default: 0.123
maxiterate = 0 # number cycles of iterative refinement are performed. Default: 0
matrix = "" # "", blosum or pam
blosum_coefficient = 62
pam_coefficient = 80

[mafft_linsi]
_inherits = mafft_default
_desc = 'Mafft with linsi method'
flag = --localpair --maxiterate 1000

[mafft_ginsi]
_inherits = mafft_default
_desc = 'Mafft with ginsi method'
flag = --globalpair --maxiterate 1000

[mafft_einsi]
_inherits = mafft_default
_desc = 'Mafft with einsi method'
flag = --ep 0 --genafpair --maxiterate 1000

[mafft_fftnsi]
_inherits = mafft_default
_desc = 'Mafft with fftnsi method'
flag = --retree 2 --maxiterate 2

[mafft_fftnsi_max]
_inherits = mafft_default
_desc = 'Mafft with fftnsi_max method'
flag = --retree 2 --maxiterate 1000

[mafft_fftns]
_inherits = mafft_default
_desc = 'Mafft with fftns method'
flag = --retree 2 --maxiterate 0

[mafft_fftns1]
_inherits = mafft_default
_desc = 'Mafft with fftns1 method'
flag = --retree 1 --maxiterate 0

[mafft_nwnsi]
_inherits = mafft_default
_desc = 'Mafft with nwnsi method'
flag = --retree 2 --maxiterate 2 --nofft

[mafft_nwns]
_inherits = mafft_default
_desc = 'Mafft with nwns method'
flag = --retree 2 --maxiterate 0 --nofft

[mafft_nwns_parttree]
_inherits = mafft_default
_desc = 'Mafft with nwns_parttree method'
flag = --retree 1 --maxiterate 0 --nofft --parttree

[muscle_default]
_desc = 'Muscle with default parameters'
_app = muscle
maxiters = 16
diags = True

[tcoffee_default]
_desc = 'Tcoffee with default parameters'
_app = tcoffee

[clustalo_default]
_desc = 'Clustalo with default parameters'
_app = clustalo
dealign = False
mode = default
iterations = 10

[famsa_default]
_desc = 'Famsa with default parameters'
_app = famsa
gt = sl
iterations = 100

[trimal_default]
_desc = 'Trimal with default parameters'
_app = trimal
gt = 0.1
st = 0
ct = 0

[trim_alg_v2_default]
_desc = 'Trim_alg_v2 with default parameters'
_app = trim_alg_v2
min_res_abs = 5
min_res_percent = 0.5

[clipkit_default]
_desc = 'Clipkit with default parameters'
_app = clipkit
mode = smart-gap
gap-threshold = 0.9
codon = False

[fasttree_default]
_desc = 'Fasttree with default parameters'
_app = fasttree
datatype = aa
model = JTT
pseudo = 1.0
gamma = True
branch_support = True
bootstrap_rep = 1000

[phyml_default]
_desc = 'Phyml with default parameters'
_app = phyml
model = JTT
datatype = aa
equilibrium_freq = empirical
prop_invar = 0
gamma = 0
branch_support = bootstrap
bootstrap = fbp
bootstrap_rep = 2
r_seed = 123456

[raxml_default]
_desc = 'Raxml with default parameters'
_app = raxml
algorithm = d
r_seed = 31416
model = PROTGAMMAJTT
bootstrap_rep = 100

[iqtree_default]
_desc = 'Iqtree with default parameters'
_app = iqtree
st = AA
alrt = 1000
seed = 31416
mode = TEST
bootstrap_rep = 1001
bootstrap = fbp

